# TLS terminates at Traefik with the default TLSStore certificate (*.adlibsys.com), like the other
# agents-namespace ingresses, so no tls block here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cumulus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cumulus.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cumulus
                port:
                  number: 8080
