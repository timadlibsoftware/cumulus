# Traefik may reach the UI/API port; only worker pods may reach the internal port (git tokens and
# MCP tools, C-10/C-11). Kubelet probes come from the node and are allowed by Calico regardless.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cumulus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cumulus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cumulus.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: cumulus
      ports:
        - protocol: TCP
          port: 8081
