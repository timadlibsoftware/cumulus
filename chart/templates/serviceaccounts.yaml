apiVersion: v1
kind: ServiceAccount
metadata:
  name: cumulus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cumulus.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.orchestratorClientId | quote }}
---
# C-3: worker pods. Workload identity only; no RoleBinding and no Kubernetes API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cumulus-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cumulus.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.agentClientId | quote }}
automountServiceAccountToken: false
