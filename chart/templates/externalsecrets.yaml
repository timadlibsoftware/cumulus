apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cumulus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cumulus.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: cumulus
    creationPolicy: Owner
  data:
    {{- range list
        (dict "name" "CUMULUS_OIDC_CLIENT_SECRET" "key" "CumulusOidcClientSecret")
        (dict "name" "CUMULUS_SESSION_SECRET" "key" "CumulusSessionKey")
        (dict "name" "CUMULUS_GITHUB_APP_ID" "key" "CumulusGithubAppId")
        (dict "name" "CUMULUS_GITHUB_APP_PRIVATE_KEY" "key" "CumulusGithubAppKey") }}
    {{- include "cumulus.externalSecretData" . | nindent 4 }}
    {{- end }}
---
# C-3 worker.env_secret: env vars injected into agent pods.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cumulus-agent-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cumulus.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStore }}
  target:
    name: cumulus-agent-env
    creationPolicy: Owner
  data:
    {{- range .Values.agentEnv }}
    {{- include "cumulus.externalSecretData" . | nindent 4 }}
    {{- end }}
