apiVersion: v1
kind: Service
metadata:
  name: cumulus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cumulus.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  type: ClusterIP
  selector:
    {{- include "cumulus.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # Agent-facing MCP tools and git tokens (C-10, C-11); never routed by the ingress.
    - name: internal
      port: 8081
      targetPort: internal
      protocol: TCP
